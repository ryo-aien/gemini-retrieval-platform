[project]
name = "notebooklm-clone-backend"
version = "0.1.0"
description = "NotebookLM-like document interaction system with Gemini File Search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "google-generativeai>=0.8.0",
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.3",
    "markdown>=3.5.2",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "pydantic>=2.5.3",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
